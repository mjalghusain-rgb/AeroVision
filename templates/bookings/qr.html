{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    📱 Booking QR Code
</h1>

<div class="card">

    <div class="card-body text-center">

        <img
        src="/bookings/qr-image/{{ booking.booking_reference }}"
        class="img-fluid"
        style="max-width:350px;">

        <hr>

        <h5>
            {{ booking.booking_reference }}
        </h5>

        <div class="mt-3">

            <a
            href="/bookings/details/{{ booking.booking_reference }}"
            class="btn btn-primary">

                Back To Booking

            </a>

            <a
            href="/bookings/ticket/{{ booking.booking_reference }}"
            class="btn btn-success">

                Download PDF

            </a>

            <a
            href="/bookings"
            class="btn btn-secondary">

                My Bookings

            </a>

        </div>

    </div>

</div>

{% endblock %}
