{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    🔍 Booking Search
</h1>

<form
method="GET"
action="/bookings/search">

    <div class="input-group mb-4">

        <input
        type="text"
        class="form-control"
        name="q"
        placeholder="Booking ID, Customer, Type, Status"
        value="{{ query }}">

        <button
        class="btn btn-primary">

            Search

        </button>

    </div>

</form>

{% if query %}

<div class="card">

    <div class="card-body">

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>Booking ID</th>
                    <th>Type</th>
                    <th>Customer</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

            {% for booking in bookings %}

                <tr>

                    <td>{{ booking.booking_id }}</td>
                    <td>{{ booking.type }}</td>
                    <td>{{ booking.customer_name }}</td>
                    <td>{{ booking.status }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endif %}

{% endblock %}
