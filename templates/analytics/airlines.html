{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    ✈ Airlines Analytics
</h1>

<div class="card">

    <div class="card-body">

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>Name</th>
                    <th>Country</th>
                    <th>IATA</th>
                    <th>ICAO</th>

                </tr>

            </thead>

            <tbody>

            {% for airline in airlines %}

                <tr>

                    <td>{{ airline.name }}</td>
                    <td>{{ airline.country }}</td>
                    <td>{{ airline.iata_code }}</td>
                    <td>{{ airline.icao_code }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
