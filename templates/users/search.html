{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    🔍 User Search
</h1>

<form
method="GET"
action="/users/search">

    <div class="input-group mb-4">

        <input
        type="text"
        class="form-control"
        name="q"
        placeholder="Username, Email, Role"
        value="{{ query }}">

        <button
        class="btn btn-primary">

            Search

        </button>

    </div>

</form>

{% if query %}

<div class="card">

    <div class="card-body">

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

            {% for user in users %}

                <tr>

                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.status }}</td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endif %}

{% endblock %}
