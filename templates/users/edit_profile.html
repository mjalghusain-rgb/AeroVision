{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    ✏ Edit Profile
</h1>

<form
method="POST"
enctype="multipart/form-data">

    <div class="mb-3">

        <label>
            First Name
        </label>

        <input
        type="text"
        name="first_name"
        class="form-control"
        value="{{ user.first_name or '' }}">

    </div>

    <div class="mb-3">

        <label>
            Last Name
        </label>

        <input
        type="text"
        name="last_name"
        class="form-control"
        value="{{ user.last_name or '' }}">

    </div>

    <div class="mb-3">

        <label>
            Phone
        </label>

        <input
        type="text"
        name="phone"
        class="form-control"
        value="{{ user.phone or '' }}">

    </div>

    <div class="mb-3">

        <label>
            Country
        </label>

        <input
        type="text"
        name="country"
        class="form-control"
        value="{{ user.country or '' }}">

    </div>

    <div class="mb-3">

        <label>
            City
        </label>

        <input
        type="text"
        name="city"
        class="form-control"
        value="{{ user.city or '' }}">

    </div>

    <div class="mb-3">

        <label>
            Bio
        </label>

        <textarea
        name="bio"
        class="form-control"
        rows="5">{{ user.bio or '' }}</textarea>

    </div>

    <div class="mb-3">

        <label>
            Profile Image
        </label>

        <input
        type="file"
        name="profile_image"
        class="form-control">

    </div>

    <button
    type="submit"
    class="btn btn-success">

        Save Profile

    </button>

</form>

{% endblock %}
