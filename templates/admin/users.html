{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    👥 User Management
</h1>

<div class="card">

    <div class="card-body">

        <table class="table table-striped table-hover">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Language</th>
                    <th>Created</th>
                    <th>Details</th>

                </tr>

            </thead>

            <tbody>

            {% for user in users %}

                <tr>

                    <td>
                        {{ user.id }}
                    </td>

                    <td>
                        {{ user.username }}
                    </td>

                    <td>
                        {{ user.email }}
                    </td>

                    <td>
                        {{ user.role }}
                    </td>

                    <td>
                        {{ user.language }}
                    </td>

                    <td>
                        {{ user.created_at }}
                    </td>

                    <td>

                        <a
                            class="btn btn-sm btn-primary"
                            href="/admin/users/{{ user.id }}">

                            Open

                        </a>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
