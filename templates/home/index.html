{% extends "base/layout.html" %}

{% block content %}

<div class="text-center py-5">

    <h1 class="display-3 hero-title">
        ✈ {{ t.hero_title }}
    </h1>

    <p class="lead">
        {{ t.hero_subtitle }}
    </p>

</div>

<div class="row g-4">

    <div class="col-md-4">

        <div class="card feature-card">

            <div class="card-body text-center">

                <h3>
                    ✈ {{ t.flights }}
                </h3>

                <p>
                    {{ t.flights_desc }}
                </p>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card feature-card">

            <div class="card-body text-center">

                <h3>
                    🏨 {{ t.hotels }}
                </h3>

                <p>
                    {{ t.hotels_desc }}
                </p>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card feature-card">

            <div class="card-body text-center">

                <h3>
                    🚗 {{ t.cars }}
                </h3>

                <p>
                    {{ t.cars_desc }}
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
