{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    🌍 Travel Information
</h1>

<div class="mb-4">

    <a
    class="btn btn-success"
    href="/travel/search">

        🔍 Search Country

    </a>

</div>

<div class="card">

    <div class="card-body">

        <table class="table table-striped table-hover">

            <thead>

                <tr>

                    <th>Country</th>
                    <th>Capital</th>
                    <th>Currency</th>
                    <th>Language</th>
                    <th>Details</th>

                </tr>

            </thead>

            <tbody>

            {% for country in countries %}

                <tr>

                    <td>
                        {{ country.country }}
                    </td>

                    <td>
                        {{ country.capital }}
                    </td>

                    <td>
                        {{ country.currency }}
                    </td>

                    <td>
                        {{ country.language }}
                    </td>

                    <td>

                        <a
                        class="btn btn-primary btn-sm"
                        href="/travel/details/{{ country.country }}">

                            Open

                        </a>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
