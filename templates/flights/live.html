{% extends "base/layout.html" %}

{% block content %}

<h1 class="mb-4">
    🌍 Live Flights
</h1>

<div class="mb-4">

    <a
    class="btn btn-secondary"
    href="/flights">

        ← Back

    </a>

</div>

<div class="card">

    <div class="card-body">

        <table class="table table-striped table-hover">

            <thead>

                <tr>

                    <th>Flight</th>
                    <th>Airline</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

            {% for flight in flights %}

                <tr>

                    <td>

                        {{ flight.flight.iata }}

                    </td>

                    <td>

                        {{ flight.airline.name }}

                    </td>

                    <td>

                        {{ flight.departure.iata }}

                    </td>

                    <td>

                        {{ flight.arrival.iata }}

                    </td>

                    <td>

                        {{ flight.flight_status }}

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
